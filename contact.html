<header>
    <h1>Contact Me</h1>
    <p>Please fill out the form below to get in touch with me.</p>
</header>

<main>
    <!-- Contact Form -->
    <form action="#" method="POST">
        
        <!-- Full Name Input -->
        <p>
            <label for="name">Full Name:</label><br>
            <input type="text" id="name" name="name" required placeholder="John Doe">
        </p>

        <!-- Email Input -->
        <p>
            <label for="email">Email Address:</label><br>
            <input type="email" id="email" name="email" required placeholder="example@email.com">
        </p>

        <!-- Inquiry Type (Dropdown) -->
        <p>
            <label for="subject">Purpose of Contact:</label><br>
            <select id="subject" name="subject">
                <option value="general">General Inquiry</option>
                <option value="feedback">Feedback</option>
                <option value="collaboration">Business/Collaboration</option>
            </select>
        </p>

        <!-- Message Input -->
        <p>
            <label for="message">Your Message:</label><br>
            <textarea id="message" name="message" rows="5" cols="40" required placeholder="Write your message here..."></textarea>
        </p>

        <!-- Form Actions -->
        <p>
            <button type="submit">Send Message</button>
            <button type="reset">Clear Form</button>
        </p>

    </form>
</main>
